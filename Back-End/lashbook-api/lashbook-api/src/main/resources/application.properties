spring.application.name=lashbook-api
server.port=8080

spring.datasource.url=jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.epjqzziqmhghgigwfbge
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

management.endpoints.web.exposure.include=health,info
app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-seconds=3600

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket=servicios

# Tamaño máximo de imágenes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.elasticsearch.uris=http://localhost:9200

# ======================================================
# WEARABLE - RECORDATORIOS
# ======================================================

# true = modo demostracion
# false = funcionamiento normal de 24 horas
lashbook.wearable.modo-demo=true

# Solo se usa cuando modo-demo=true
lashbook.wearable.anticipacion-demo-minutos=5
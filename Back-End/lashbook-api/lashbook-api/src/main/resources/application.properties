spring.application.name=lashbook-api

# ======================================================
# SERVIDOR
# ======================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# ======================================================
# POSTGRESQL / SUPABASE
# ======================================================

spring.datasource.url=jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.epjqzziqmhghgigwfbge
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1


# ======================================================
# ACTUATOR
# ======================================================

management.endpoints.web.exposure.include=health,info

# Evita que el health check falle por Elasticsearch
# mientras Elasticsearch esté desactivado.
management.health.elasticsearch.enabled=false


# ======================================================
# JWT
# ======================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600


# ======================================================
# SUPABASE STORAGE
# ======================================================

supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket=servicios


# ======================================================
# ARCHIVOS / IMÁGENES
# ======================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ======================================================
# ELASTICSEARCH
# ======================================================

# En Render toma ELASTICSEARCH_URL.
# En local usa localhost solamente como valor por defecto.
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}

# En Render toma ELASTIC_API_KEY.
# En local puede permanecer vacía.
spring.elasticsearch.api-key=${ELASTIC_API_KEY:}

# Temporalmente puede permanecer false.
# Cuando quieras volver a activar Elastic en Render:
# ELASTICSEARCH_ENABLED=true
lashbook.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:false}

# No carga repositories Elasticsearch cuando está apagado.
spring.data.elasticsearch.repositories.enabled=${ELASTICSEARCH_ENABLED:false}


# ======================================================
# WEARABLE - RECORDATORIOS
# ======================================================

# true = modo demostración
# false = funcionamiento normal
lashbook.wearable.modo-demo=true

# Solo se usa cuando modo-demo=true
lashbook.wearable.anticipacion-demo-minutos=4